<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samir Social — Reels</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Aviso de llamada entrante, visible en cualquier página del sitio -->
  <script type="module" src="incoming-call.js"></script>
</head>
<body class="page-reelfeed">
  <a class="back" href="home.html">← Inicio</a>
  <div id="feed"></div>
  <div id="empty" style="display:none;">Todavía no hay reels. ¡Sé el primero en subir uno!</div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://klziukovalzzcinifvaw.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtseml1a292YWx6emNpbmlmdmF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY0Mzg1MDcsImV4cCI6MjA3MjAxNDUwN30.edpw-UnymgHSAhp54SX6CCKfEjB7SQDdSrhH3wc-Eh4";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const feed = document.getElementById("feed");
    let current = 0;

    async function loadReels() {
      const { data, error } = await supabase.storage.from("Samir").list("reels", {
        limit: 100,
        sortBy: { column: "created_at", order: "desc" }
      });

      if (error) {
        console.error("Error cargando videos:", error.message);
        document.getElementById("empty").style.display = "flex";
        document.getElementById("empty").textContent = "No se pudieron cargar los reels.";
        return;
      }

      if (!data || data.length === 0) {
        document.getElementById("empty").style.display = "flex";
        return;
      }

      for (let file of data) {
        const { data: urlData } = supabase.storage.from("Samir").getPublicUrl("reels/" + file.name);
        const fileUrl = urlData.publicUrl;

        let reel = document.createElement("div");
        reel.className = "reel";
        reel.innerHTML = `
          <video src="${fileUrl}" loop playsinline></video>
          <div class="actions">
            <button>❤️</button>
            <button>💬</button>
            <button>🔗</button>
          </div>
        `;
        feed.appendChild(reel);
      }

      playCurrentReel();
    }

    loadReels();

    function showReel(index) {
      const reels = document.querySelectorAll(".reel");
      if (index >= 0 && index < reels.length) {
        current = index;
        feed.style.transform = `translateY(-${current * 100}vh)`;
        playCurrentReel();
      }
    }

    function playCurrentReel() {
      const videos = document.querySelectorAll("video");
      videos.forEach((video, i) => {
        if (i === current) {
          video.play();
        } else {
          video.pause();
          video.currentTime = 0;
        }
      });
    }

    window.addEventListener("wheel", e => {
      const reels = document.querySelectorAll(".reel");
      if (e.deltaY > 0 && current < reels.length - 1) showReel(current + 1);
      else if (e.deltaY < 0 && current > 0) showReel(current - 1);
    });

    let startY = 0;
    window.addEventListener("touchstart", e => { startY = e.touches[0].clientY; });
    window.addEventListener("touchend", e => {
      let endY = e.changedTouches[0].clientY;
      let diff = startY - endY;
      if (diff > 50) showReel(current + 1);
      else if (diff < -50) showReel(current - 1);
    });
  </script>
</body>
</html>
