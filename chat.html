<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social — Chat privado</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-chat">
  <header class="topbar">
    <div class="brand"><span class="dot"></span>Chat privado</div>
    <nav style="display:flex; align-items:center; gap:14px;">
      <a href="home.html" style="color:var(--ink-dim); text-decoration:none; font-size:14px; font-weight:500;">Inicio</a>
      <button id="logoutBtn" class="btn-ghost" style="border-radius:999px;">Cerrar sesión</button>
    </nav>
  </header>
  
  <div class="chat-shell">
    
    <section id="friendList"><p class="empty">Cargando contactos...</p></section>

    <section id="chatWindow" style="display:none;">
      <button id="backBtn">← Volver a contactos</button>
      <div style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
        <h3 id="chatWith"></h3>
        <div style="display:flex; gap:8px;">
          <button id="audioCallBtn" type="button" title="Llamada de voz">🎙️ Llamar</button>
          <button id="videoCallBtn" type="button" title="Videollamada">🎥 Video</button>
        </div>
      </div>
      <div id="chatErrorBox"></div>
      <div id="messages"></div>
      <div id="typingIndicator" class="typing-indicator" style="display:none;">
        <span></span><span></span><span></span>
      </div>
      <footer class="chatbox">
        <input type="text" id="messageInput" class="field" placeholder="Escribe un mensaje..." autocomplete="off">
        <button id="micBtn" type="button" title="Grabar audio">🎤</button>
        <button id="sendBtn">Enviar</button>
      </footer>
      <div id="recordingBar" class="recording-bar" style="display:none;">
        <span class="recording-dot"></span>
        <span id="recordingTime">0:00</span>
        <span class="recording-label">Grabando audio...</span>
        <button id="cancelRecordBtn" type="button">Cancelar</button>
        <button id="stopRecordBtn" type="button">Enviar audio</button>
      </div>
      
    
  </div>

  <!-- Aviso de llamada entrante (aparece sobre cualquier pantalla del chat) -->
  <div id="incomingCallBar" class="incoming-call-bar" style="display:none;">
    <div class="incoming-call-info">
      <span id="incomingCallText"></span>
    </div>
    <div class="incoming-call-actions">
      <button id="rejectCallBtn" type="button" class="call-reject">Colgar</button>
      <button id="acceptCallBtn" type="button" class="call-accept">Contestar</button>
    </div>
  </div>

  <!-- Llamada activa: audio o video, conexión directa WebRTC entre los dos navegadores -->
  <div id="callModal" class="call-modal" style="display:none;">
    <div class="call-modal-box">
      <div class="call-modal-header">
        <span id="callWithLabel"></span>
        <span id="callStatusLabel" class="call-status"></span>
      </div>

      <div id="videoArea" class="video-area" style="display:none;">
        <video id="remoteVideo" class="remote-video" autoplay playsinline></video>
        <video id="localVideo" class="local-video" autoplay playsinline muted></video>
      </div>

      <div id="audioArea" class="audio-area" style="display:none;">
        <div class="audio-avatar">🎙️</div>
        <audio id="remoteAudio" autoplay></audio>
      </div>

      <div class="call-controls">
        <button id="toggleMicBtn" type="button" title="Silenciar micrófono">🎙️</button>
        <button id="toggleCamBtn" type="button" title="Apagar cámara" style="display:none;">🎥</button>
        <button id="hangupBtn" type="button" class="call-hangup" title="Colgar">📴</button>
      </div>
    </div>
  </div>

  <!-- Cloudinary (almacenamiento de los audios de voz del chat privado) -->
  <script>
    // Cuenta gratuita de Cloudinary. El "upload preset" es "unsigned",
    // por eso no hace falta ninguna clave secreta aquí: Cloudinary permite
    // subir directo desde el navegador validando solo con el nombre del
    // preset (configurado como "Unsigned" en el dashboard).
    const CLOUDINARY_CLOUD_NAME = "dbgpvwprb";
    const CLOUDINARY_UPLOAD_PRESET = "chat_audio";
    // Cloudinary no tiene un tipo de recurso "audio" propio: los archivos
    // de audio se suben y sirven como si fueran "video" (endpoint /video/upload).
    const CLOUDINARY_UPLOAD_URL = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/video/upload`;
  </script>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
    import {
      collection, addDoc, query, onSnapshot, getDocs, getDoc,
      updateDoc, doc, where, arrayUnion, serverTimestamp,
      setDoc, deleteDoc
    } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";

    let currentUser;
    let currentUserNombre = null;
    let currentFriend;
    let chatId;
    let unsubMessages = null;
    let unsubTyping = null;
    let typingTimeout = null;

    // Estado de la llamada activa (audio o video, WebRTC directo)
    let peerConnection = null;
    let localStream = null;
    let isCaller = false;
    let currentCallType = null;   // "audio" | "video"
    let activeCallDocId = null;
    let activeCallPeerUid = null;
    let activeCallPeerName = null;
    let callWasAnswered = false;
    let callConnectedAt = null;
    let callTimerInterval = null;
    // Evita que colgarLlamada() se ejecute "encimada" consigo misma: al
    // actualizar el estado a "ended" en Firestore, el propio listener de
    // este mismo navegador (escucharDocLlamada) se dispara casi al
    // instante y volvía a llamar a colgarLlamada() mientras la primera
    // llamada todavía no terminaba. Esa "carrera" era la causa de que a
    // veces quedaran DOS mensajes de una sola llamada (por ejemplo
    // "Llamada rechazada" y, debajo, "Llamada cancelada").
    let colgandoLlamada = false;
    let unsubCallDoc = null;
    let unsubRemoteCandidates = null;
    let unsubIncomingCalls = null;

    // Servidores STUN/TURN gratuitos para que los dos navegadores puedan
    // encontrarse. STUN (de Google) resuelve la mayoría de los casos;
    // el TURN público de Open Relay Project es un respaldo gratuito para
    // redes más cerradas (4G, algunas oficinas) donde el STUN no basta.
    const ICE_SERVERS = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        {
          urls: "turn:openrelay.metered.ca:80",
          username: "openrelayproject",
          credential: "openrelayproject"
        },
        {
          urls: "turn:openrelay.metered.ca:443",
          username: "openrelayproject",
          credential: "openrelayproject"
        }
      ]
    };

    onAuthStateChanged(auth, (user) => {
      if (!user) { window.location.href = "index.html"; return; }
      currentUser = user;
      marcarEnLinea();
      loadFriends();
      escucharLlamadasEntrantes();
      manejarLlamadaEntranteDesdeURL();
    });

    // Si el usuario contestó la llamada desde el aviso global (visible en
    // home, subir reel, ver reels o el panel admin — ver incoming-call.js),
    // llega acá con "?incomingCall=<id>" en la URL. Buscamos esa llamada
    // y la contestamos automáticamente con la misma función de siempre.
    async function manejarLlamadaEntranteDesdeURL() {
      const params = new URLSearchParams(window.location.search);
      const callId = params.get("incomingCall");
      if (!callId) return;

      // Limpiamos el parámetro para que un refresh no intente contestar
      // la misma llamada otra vez (por ejemplo, si ya colgaron).
      window.history.replaceState({}, "", window.location.pathname);

      try {
        const callSnap = await getDoc(doc(db, "calls", callId));
        if (!callSnap.exists()) return;

        const data = callSnap.data();
        if (data.status !== "calling" || data.to !== currentUser.uid) return;

        // De paso, abrimos la ventana de chat con quien está llamando
        // (si ya la encontramos entre los contactos), para que quede
        // todo listo si después quiere escribirle.
        try {
          const usersSnap = await getDocs(collection(db, "users"));
          const friend = usersSnap.docs.map(d => d.data()).find(u => u.uid === data.from);
          if (friend) openChat(friend);
        } catch (e) { /* no bloquea el poder contestar la llamada */ }

        await aceptarLlamada(callId, data);
      } catch (err) {
        console.error("Error contestando la llamada desde otra pantalla:", err);
      }
    }

    // Vuelve a marcar al usuario como "en línea" al entrar a esta página.
    // home.html hace lo mismo al cargar, pero borra ese registro con
    // beforeunload al SALIR de home.html (incluso al navegar a otra
    // página del sitio, no solo al cerrar la pestaña). Por eso, al entrar
    // al chat privado, había que volver a crearlo aquí; si no, el usuario
    // quedaba marcado como desconectado mientras chateaba.
    async function marcarEnLinea() {
      try {
        await setDoc(doc(db, "onlineUsers", currentUser.uid), {
          email: currentUser.email,
          lastActive: serverTimestamp(),
          online: true
        }, { merge: true });
      } catch (err) {
        console.error("Error marcando usuario en línea:", err);
      }
    }

    async function loadFriends() {
      const querySnap = await getDocs(collection(db, "users"));
      const listDiv = document.getElementById("friendList");
      listDiv.innerHTML = "<h3>Contactos</h3>";

      const todos = querySnap.docs.map(d => d.data());

      // Nos quedamos con nuestro propio nombre (para mostrarlo en el
      // aviso de llamada entrante del otro usuario, en vez de tu correo).
      const propio = todos.find(u => u.uid === currentUser.uid);
      currentUserNombre = (propio && propio.nombre) ? propio.nombre : currentUser.email;

      const otros = todos.filter(u => u.uid !== currentUser.uid);
      if (otros.length === 0) {
        listDiv.innerHTML += "<p class='empty'>Todavía no hay otros usuarios registrados.</p>";
        return;
      }

      otros.forEach((data) => {
        const btn = document.createElement("button");
        btn.className = "friend";
        btn.innerHTML = `<span>${data.nombre || data.email}</span>`;

        // Notificación de mensajes no leídos con este contacto.
        // Esta consulta solo usa "where" (sin orderBy), así que no necesita
        // ningún índice compuesto en Firestore.
        // Se filtra también por "participants" (array-contains) porque las
        // reglas de seguridad de Firestore, para operaciones de lista, exigen
        // que la propia consulta garantice que solo se pueden leer documentos
        // donde el usuario actual participa; con un simple where("chatId",...)
        // Firestore no puede probar eso y rechaza la consulta con
        // "Missing or insufficient permissions".
        const chatKey = [currentUser.uid, data.uid].sort().join("_");
        const q = query(
          collection(db, "privateChat"),
          where("chatId", "==", chatKey),
          where("participants", "array-contains", currentUser.uid)
        );
        onSnapshot(q, (snap) => {
          const unreadCount = snap.docs.filter(d => {
            const m = d.data();
            return m.to === currentUser.uid && (!m.readBy || !m.readBy.includes(currentUser.uid));
          }).length;
          btn.innerHTML = unreadCount > 0
            ? `<span>${data.nombre || data.email}</span><span class="unread">${unreadCount}</span>`
            : `<span>${data.nombre || data.email}</span>`;
        }, (err) => {
          console.error("Error escuchando mensajes no leídos:", err);
        });

        btn.onclick = () => openChat(data);
        listDiv.appendChild(btn);
      });
    }

    function openChat(friend) {
      currentFriend = friend;
      chatId = [currentUser.uid, friend.uid].sort().join("_");

      document.getElementById("chatWith").textContent = "Chateando con " + (friend.nombre || friend.email);
      document.getElementById("friendList").style.display = "none";
      document.getElementById("chatWindow").style.display = "block";
      document.getElementById("chatErrorBox").innerHTML = "";

      loadMessages();
      escucharEscribiendo();
    }

    // ------------------------------------------------------------------
    // Videollamada con Jitsi Meet (gratis, sin servidor propio)
    // ------------------------------------------------------------------
    // La "sala" es simplemente un nombre único: reusamos el mismo chatId
    // (ya es único por pareja de usuarios) con un prefijo para no chocar
    // con salas de otras personas que usen meet.jit.si.
    // ------------------------------------------------------------------
    // Llamadas de voz/video (WebRTC directo entre navegadores)
    // ------------------------------------------------------------------
    // No usamos ningún servicio externo tipo Jitsi: los dos navegadores
    // se conectan directo entre sí (peer-to-peer). Firestore solo se usa
    // como "mensajero" para intercambiar la oferta/respuesta SDP y los
    // candidatos ICE (colección "calls"), igual que ya usas Firestore
    // para el chat y el estado "en línea".

    function escucharLlamadasEntrantes() {
      // El "where" por participants (array-contains) es imprescindible:
      // las reglas de seguridad de Firestore, para operaciones de LISTA,
      // exigen que la propia consulta pruebe que el usuario actual
      // pertenece al documento (mismo caso que privateChat, ver README).
      // Sin este filtro, Firestore rechaza la consulta en silencio y el
      // aviso de llamada entrante nunca aparece.
      const q = query(
        collection(db, "calls"),
        where("to", "==", currentUser.uid),
        where("participants", "array-contains", currentUser.uid),
        where("status", "==", "calling")
      );
      unsubIncomingCalls = onSnapshot(q, (snap) => {
        const llamada = snap.docs[0];
        if (llamada) {
          mostrarLlamadaEntrante(llamada.id, llamada.data());
        } else {
          ocultarBannerEntrante();
        }
      }, (err) => console.error("Error escuchando llamadas entrantes:", err));
    }

    function mostrarLlamadaEntrante(callId, data) {
      if (activeCallDocId) return; // ya en llamada: lo ignoramos (simplificación)
      const bar = document.getElementById("incomingCallBar");
      const tipoTexto = data.type === "video" ? "videollamada" : "llamada";
      document.getElementById("incomingCallText").textContent =
        `${data.fromName || "Alguien"} te está haciendo una ${tipoTexto}...`;
      bar.style.display = "flex";

      document.getElementById("acceptCallBtn").onclick = () => aceptarLlamada(callId, data);
      document.getElementById("rejectCallBtn").onclick = () => rechazarLlamada(callId);
    }

    function ocultarBannerEntrante() {
      document.getElementById("incomingCallBar").style.display = "none";
    }

    async function iniciarLlamada(type) {
      if (!chatId || !currentFriend || activeCallDocId) return;

      currentCallType = type;
      isCaller = true;
      activeCallDocId = chatId;
      activeCallPeerUid = currentFriend.uid;
      activeCallPeerName = currentFriend.nombre || currentFriend.email;
      callWasAnswered = false;
      callConnectedAt = null;

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: type === "video"
        });
      } catch (err) {
        alert("No se pudo acceder al micrófono/cámara: " + err.message);
        limpiarEstadoLlamada();
        return;
      }

      mostrarUILlamada(type, currentFriend.nombre || currentFriend.email, "Llamando...");

      peerConnection = crearPeerConnection();
      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);

      await setDoc(doc(db, "calls", chatId), {
        from: currentUser.uid,
        fromName: currentUserNombre || currentUser.email,
        to: currentFriend.uid,
        participants: [currentUser.uid, currentFriend.uid],
        type,
        status: "calling",
        offer: { type: offer.type, sdp: offer.sdp },
        createdAt: serverTimestamp()
      });

      escucharDocLlamada(chatId);
      escucharCandidatosRemotos(chatId, "calleeCandidates");
    }

    async function aceptarLlamada(callId, data) {
      ocultarBannerEntrante();
      if (activeCallDocId) return;

      isCaller = false;
      currentCallType = data.type;
      activeCallDocId = callId;
      activeCallPeerUid = data.from;
      activeCallPeerName = data.fromName || "Contacto";

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: data.type === "video"
        });
      } catch (err) {
        alert("No se pudo acceder al micrófono/cámara: " + err.message);
        try { await updateDoc(doc(db, "calls", callId), { status: "declined" }); } catch (e) {}
        limpiarEstadoLlamada();
        return;
      }

      mostrarUILlamada(data.type, data.fromName || "Contacto", "Conectando...");

      peerConnection = crearPeerConnection();
      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

      await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);

      await updateDoc(doc(db, "calls", callId), {
        status: "accepted",
        answer: { type: answer.type, sdp: answer.sdp }
      });

      escucharDocLlamada(callId);
      escucharCandidatosRemotos(callId, "callerCandidates");
    }

    async function rechazarLlamada(callId) {
      ocultarBannerEntrante();
      try {
        await updateDoc(doc(db, "calls", callId), { status: "declined" });
      } catch (err) {
        console.error("Error rechazando llamada:", err);
      }
    }

    function crearPeerConnection() {
      const pc = new RTCPeerConnection(ICE_SERVERS);

      pc.onicecandidate = (event) => {
        if (!event.candidate || !activeCallDocId) return;
        const subcoleccion = isCaller ? "callerCandidates" : "calleeCandidates";
        addDoc(collection(db, "calls", activeCallDocId, subcoleccion), event.candidate.toJSON())
          .catch(err => console.error("Error guardando candidato ICE:", err));
      };

      pc.ontrack = (event) => {
        if (currentCallType === "video") {
          document.getElementById("remoteVideo").srcObject = event.streams[0];
        } else {
          document.getElementById("remoteAudio").srcObject = event.streams[0];
        }
        // Este es el momento real en que el audio/video empieza a fluir
        // entre los dos (tanto para quien llamó como para quien contestó),
        // así que es el punto correcto para marcar la llamada como
        // "conectada" y arrancar el cronómetro — no cuando se acepta la
        // señal SDP, que puede pasar unos segundos antes de que el audio
        // realmente conecte.
        if (!callWasAnswered) {
          callWasAnswered = true;
          callConnectedAt = Date.now();
          iniciarCronometroLlamada();
        }
      };

      pc.onconnectionstatechange = () => {
        if (["disconnected", "failed", "closed"].includes(pc.connectionState) && activeCallDocId) {
          colgarLlamada(false);
        }
      };

      return pc;
    }

    function escucharDocLlamada(callId) {
      if (unsubCallDoc) unsubCallDoc();
      unsubCallDoc = onSnapshot(doc(db, "calls", callId), async (snap) => {
        const data = snap.data();
        if (!data) return;

        if (isCaller && data.status === "accepted" && data.answer &&
            peerConnection && !peerConnection.currentRemoteDescription) {
          await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
          // El cronómetro y "callWasAnswered" ya no se marcan acá: se
          // marcan en pc.ontrack (más abajo), que es el momento real en
          // que el audio empieza a fluir. Aceptar la señal SDP puede
          // pasar unos segundos antes de que el audio realmente conecte.
        }

        if (data.status === "declined" && isCaller) {
          document.getElementById("callStatusLabel").textContent = "Llamada rechazada";
          setTimeout(() => colgarLlamada(false), 1200);
        }

        if (data.status === "ended") {
          colgarLlamada(false);
        }
      }, (err) => console.error("Error escuchando llamada:", err));
    }

    function escucharCandidatosRemotos(callId, subcoleccion) {
      if (unsubRemoteCandidates) unsubRemoteCandidates();
      unsubRemoteCandidates = onSnapshot(collection(db, "calls", callId, subcoleccion), (snap) => {
        snap.docChanges().forEach((change) => {
          if (change.type === "added" && peerConnection) {
            peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()))
              .catch(err => console.error("Error añadiendo candidato ICE:", err));
          }
        });
      }, (err) => console.error("Error escuchando candidatos:", err));
    }

    function mostrarUILlamada(type, nombre, estado) {
      document.getElementById("callWithLabel").textContent = nombre;
      document.getElementById("callStatusLabel").textContent = estado;
      document.getElementById("videoArea").style.display = type === "video" ? "flex" : "none";
      document.getElementById("audioArea").style.display = type === "video" ? "none" : "flex";
      document.getElementById("toggleCamBtn").style.display = type === "video" ? "inline-flex" : "none";
      if (type === "video") {
        document.getElementById("localVideo").srcObject = localStream;
      }
      document.getElementById("callModal").style.display = "flex";
    }

    // Cronómetro en vivo: en cuanto el audio/video realmente conecta
    // (ver pc.ontrack), mostramos "Llamada conectada" y desde ahí un
    // reloj tipo 0:01, 0:02... que sigue corriendo mientras dura la
    // llamada, igual que WhatsApp.
    function iniciarCronometroLlamada() {
      detenerCronometroLlamada();
      actualizarCronometroLlamada();
      callTimerInterval = setInterval(actualizarCronometroLlamada, 1000);
    }

    function actualizarCronometroLlamada() {
      if (!callConnectedAt) return;
      const segundos = Math.max(0, Math.round((Date.now() - callConnectedAt) / 1000));
      const m = Math.floor(segundos / 60);
      const s = String(segundos % 60).padStart(2, "0");
      const label = document.getElementById("callStatusLabel");
      if (label) label.textContent = `Llamada conectada · ${m}:${s}`;
    }

    function detenerCronometroLlamada() {
      if (callTimerInterval) {
        clearInterval(callTimerInterval);
        callTimerInterval = null;
      }
    }

    async function colgarLlamada(notificarOtroLado = true) {
      // Ver el comentario junto a "let colgandoLlamada": esto evita que
      // el propio cambio de estado dispare una segunda ejecución de esta
      // misma función mientras la primera todavía se está procesando.
      if (colgandoLlamada) return;
      colgandoLlamada = true;
      detenerCronometroLlamada();

      try {
      if (notificarOtroLado && activeCallDocId) {
        try { await updateDoc(doc(db, "calls", activeCallDocId), { status: "ended" }); } catch (e) {}
      }

      // Dejamos constancia de la llamada en el chat, como hace WhatsApp
      // ("Llamada rechazada", "Llamada perdida", "Llamada · 3:24"...).
      // Solo lo escribe quien llamó (isCaller), para no duplicar el
      // mensaje cuando ambos lados disparan colgarLlamada() a la vez.
      if (isCaller && activeCallDocId && activeCallPeerUid) {
        let callResult;
        if (callWasAnswered) {
          callResult = "finalizada";
        } else {
          callResult = notificarOtroLado ? "cancelada" : "rechazada";
        }
        const duracionSeg = (callWasAnswered && callConnectedAt)
          ? Math.max(0, Math.round((Date.now() - callConnectedAt) / 1000))
          : 0;

        try {
          await addDoc(collection(db, "privateChat"), {
            chatId: activeCallDocId,
            uid: currentUser.uid,
            to: activeCallPeerUid,
            participants: [currentUser.uid, activeCallPeerUid],
            type: "call",
            callType: currentCallType,
            callResult,
            duration: duracionSeg,
            content: "",
            readBy: [],
            timestamp: serverTimestamp()
          });
        } catch (err) {
          console.error("Error guardando el registro de la llamada:", err);
        }
      }

      if (unsubCallDoc) { unsubCallDoc(); unsubCallDoc = null; }
      if (unsubRemoteCandidates) { unsubRemoteCandidates(); unsubRemoteCandidates = null; }

      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }

      // Se borra el documento de la llamada y sus candidatos ICE para no
      // dejar basura acumulándose en Firestore.
      if (activeCallDocId) {
        const idParaBorrar = activeCallDocId;
        setTimeout(async () => {
          try {
            const callerCands = await getDocs(collection(db, "calls", idParaBorrar, "callerCandidates"));
            const calleeCands = await getDocs(collection(db, "calls", idParaBorrar, "calleeCandidates"));
            for (const d of [...callerCands.docs, ...calleeCands.docs]) await deleteDoc(d.ref);
            await deleteDoc(doc(db, "calls", idParaBorrar));
          } catch (e) { /* el otro lado puede haberlo borrado ya; no pasa nada */ }
        }, 1500);
      }

      document.getElementById("remoteVideo").srcObject = null;
      document.getElementById("localVideo").srcObject = null;
      document.getElementById("remoteAudio").srcObject = null;
      document.getElementById("callModal").style.display = "none";

      limpiarEstadoLlamada();
      } finally {
        colgandoLlamada = false;
      }
    }

    function limpiarEstadoLlamada() {
      activeCallDocId = null;
      activeCallPeerUid = null;
      activeCallPeerName = null;
      isCaller = false;
      currentCallType = null;
      callWasAnswered = false;
      callConnectedAt = null;
    }

    document.getElementById("audioCallBtn").addEventListener("click", () => iniciarLlamada("audio"));
    document.getElementById("videoCallBtn").addEventListener("click", () => iniciarLlamada("video"));
    document.getElementById("hangupBtn").addEventListener("click", () => colgarLlamada(true));

    document.getElementById("toggleMicBtn").addEventListener("click", () => {
      if (!localStream) return;
      const track = localStream.getAudioTracks()[0];
      if (!track) return;
      track.enabled = !track.enabled;
      document.getElementById("toggleMicBtn").textContent = track.enabled ? "🎙️" : "🔇";
    });

    document.getElementById("toggleCamBtn").addEventListener("click", () => {
      if (!localStream) return;
      const track = localStream.getVideoTracks()[0];
      if (!track) return;
      track.enabled = !track.enabled;
      document.getElementById("toggleCamBtn").textContent = track.enabled ? "🎥" : "📷";
    });

    document.getElementById("backBtn").addEventListener("click", () => {
      if (unsubMessages) unsubMessages();
      if (unsubTyping) unsubTyping();
      marcarEscribiendo(false);
      if (activeCallDocId) colgarLlamada(true);
      document.getElementById("chatWindow").style.display = "none";
      document.getElementById("friendList").style.display = "block";
    });

    async function sendMessage() {
      const input = document.getElementById("messageInput");
      const text = input.value.trim();
      if (text === "" || !chatId) return;
      input.value = "";
      marcarEscribiendo(false); // al enviar, dejamos de mostrar "escribiendo..."
      try {
        await addDoc(collection(db, "privateChat"), {
          chatId,
          uid: currentUser.uid,
          to: currentFriend.uid,
          // Array con ambos UIDs: permite que las reglas de seguridad
          // verifiquen, directamente desde la consulta, que el usuario
          // que lee pertenece a la conversación (ver firestore.rules).
          participants: [currentUser.uid, currentFriend.uid],
          content: text,
          readBy: [],
          timestamp: serverTimestamp()
        });
      } catch (err) {
        console.error("Error enviando mensaje:", err);
        document.getElementById("chatErrorBox").innerHTML =
          `<div class="chat-error">No se pudo enviar el mensaje: ${err.message}</div>`;
      }
    }
    document.getElementById("sendBtn").addEventListener("click", sendMessage);
    document.getElementById("messageInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    // ------------------------------------------------------------------
    // Notas de audio
    // ------------------------------------------------------------------
    // Se graba con MediaRecorder (API nativa del navegador) y el archivo
    // resultante (.webm) se sube a Cloudinary (carpeta configurada en el
    // upload preset "chat_audio"). Igual que con las imágenes en
    // home.html, se guarda solo la URL pública en Firestore, no el
    // archivo en sí.
    let mediaRecorder = null;
    let audioChunks = [];
    let recordingInterval = null;
    let recordingSeconds = 0;

    const micBtn = document.getElementById("micBtn");
    const recordingBar = document.getElementById("recordingBar");
    const recordingTimeEl = document.getElementById("recordingTime");

    micBtn.addEventListener("click", async () => {
      if (!chatId) return;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.addEventListener("dataavailable", (e) => {
          if (e.data.size > 0) audioChunks.push(e.data);
        });

        mediaRecorder.start();
        recordingSeconds = 0;
        recordingTimeEl.textContent = "0:00";
        recordingBar.style.display = "flex";
        document.querySelector(".chatbox").style.display = "none";

        recordingInterval = setInterval(() => {
          recordingSeconds++;
          const m = Math.floor(recordingSeconds / 60);
          const s = String(recordingSeconds % 60).padStart(2, "0");
          recordingTimeEl.textContent = `${m}:${s}`;
        }, 1000);
      } catch (err) {
        console.error("Error accediendo al micrófono:", err);
        document.getElementById("chatErrorBox").innerHTML =
          `<div class="chat-error">No se pudo acceder al micrófono: ${err.message}</div>`;
      }
    });

    function detenerGrabacion() {
      clearInterval(recordingInterval);
      recordingBar.style.display = "none";
      document.querySelector(".chatbox").style.display = "flex";
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
      }
    }

    document.getElementById("cancelRecordBtn").addEventListener("click", () => {
      if (mediaRecorder) {
        mediaRecorder.onstop = null; // no enviar nada al cancelar
        if (mediaRecorder.state !== "inactive") mediaRecorder.stop();
      }
      detenerGrabacion();
    });

    document.getElementById("stopRecordBtn").addEventListener("click", () => {
      if (!mediaRecorder || mediaRecorder.state === "inactive") return;
      mediaRecorder.onstop = async () => {
        detenerGrabacion();
        await subirYEnviarAudio();
      };
      mediaRecorder.stop();
    });

    async function subirYEnviarAudio() {
      if (audioChunks.length === 0 || !chatId) return;

      const blob = new Blob(audioChunks, { type: "audio/webm" });
      const fileName = `${chatId}_${Date.now()}.webm`;

      try {
        // Subida "unsigned" a Cloudinary: se manda el archivo directo
        // desde el navegador usando FormData, sin backend propio.
        const formData = new FormData();
        formData.append("file", blob, fileName);
        formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

        const res = await fetch(CLOUDINARY_UPLOAD_URL, {
          method: "POST",
          body: formData
        });
        const data = await res.json();

        if (!res.ok || !data.secure_url) {
          const mensaje = (data && data.error && data.error.message) || "Error desconocido subiendo a Cloudinary.";
          document.getElementById("chatErrorBox").innerHTML =
            `<div class="chat-error">No se pudo subir el audio: ${mensaje}</div>`;
          return;
        }

        await addDoc(collection(db, "privateChat"), {
          chatId,
          uid: currentUser.uid,
          to: currentFriend.uid,
          participants: [currentUser.uid, currentFriend.uid],
          type: "audio",
          audioUrl: data.secure_url,
          content: "",
          readBy: [],
          timestamp: serverTimestamp()
        });
      } catch (err) {
        console.error("Error enviando audio:", err);
        document.getElementById("chatErrorBox").innerHTML =
          `<div class="chat-error">No se pudo enviar el audio: ${err.message}</div>`;
      }
    }

    // ------------------------------------------------------------------
    // Indicador de "está escribiendo..." (las bolitas tipo WhatsApp)
    // ------------------------------------------------------------------
    // Se usa una colección nueva "typingStatus" con UN documento por
    // conversación (mismo id que chatId). Dentro, cada usuario tiene su
    // propio campo con su UID, en true si está escribiendo ahora mismo.
    // Con setDoc(..., {merge:true}) cada quien solo toca su propio campo,
    // sin pisar el del otro usuario.

    document.getElementById("messageInput").addEventListener("input", () => {
      if (!chatId) return;
      marcarEscribiendo(true);
      // Si el usuario deja de teclear 2 segundos, se apaga solo,
      // por si cierra la pestaña o se queda pensando sin escribir.
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => marcarEscribiendo(false), 2000);
    });

    async function marcarEscribiendo(estaEscribiendo) {
      if (!chatId || !currentUser) return;
      try {
        await setDoc(
          doc(db, "typingStatus", chatId),
          { [currentUser.uid]: estaEscribiendo },
          { merge: true }
        );
      } catch (err) {
        console.error("Error actualizando estado de escritura:", err);
      }
    }

    function escucharEscribiendo() {
      if (unsubTyping) unsubTyping();
      const indicador = document.getElementById("typingIndicator");
      unsubTyping = onSnapshot(doc(db, "typingStatus", chatId), (snap) => {
        const data = snap.data();
        const amigoEscribiendo = !!(data && data[currentFriend.uid]);
        indicador.style.display = amigoEscribiendo ? "flex" : "none";
      }, (err) => {
        console.error("Error escuchando estado de escritura:", err);
      });
    }

    // BUG ARREGLADO:
    // Antes esta consulta combinaba where("chatId","==",chatId) con
    // orderBy("timestamp"). Firestore exige un índice compuesto para eso,
    // y como el proyecto no lo tenía creado, la consulta fallaba en
    // silencio (onSnapshot nunca entregaba datos) y el chat privado se
    // quedaba vacío para siempre, aunque el chat general sí funcionaba
    // porque ese solo usa orderBy sin where.
    // Ahora se ordena en el propio navegador, así no hace falta ningún
    // índice adicional en Firestore, y se muestra cualquier error real
    // en pantalla en vez de solo en la consola.
    function loadMessages() {
      if (unsubMessages) unsubMessages();
      // Igual que en loadFriends(): se agrega el filtro por "participants"
      // (array-contains) porque las reglas de seguridad exigen que la
      // propia consulta pruebe que el usuario actual pertenece al chat.
      const q = query(
        collection(db, "privateChat"),
        where("chatId", "==", chatId),
        where("participants", "array-contains", currentUser.uid)
      );
      unsubMessages = onSnapshot(q, (snapshot) => {
        document.getElementById("chatErrorBox").innerHTML = "";
        const messagesDiv = document.getElementById("messages");
        messagesDiv.innerHTML = "";

        const docsOrdenados = snapshot.docs
          .map(d => ({ id: d.id, data: d.data() }))
          .sort((a, b) => {
            const ta = a.data.timestamp ? a.data.timestamp.toMillis() : 0;
            const tb = b.data.timestamp ? b.data.timestamp.toMillis() : 0;
            return ta - tb;
          });

        if (docsOrdenados.length === 0) {
          messagesDiv.innerHTML = "<p class='empty'>Todavía no hay mensajes. Escribe el primero.</p>";
        } else {
          docsOrdenados.forEach(({ data: msg }) => {
            const esMio = msg.uid === currentUser.uid;

            const div = document.createElement("div");
            div.classList.add("msg", esMio ? "mine" : "theirs");

            if (msg.type === "audio" && msg.audioUrl) {
              const audioEl = document.createElement("audio");
              audioEl.className = "msg-audio";
              audioEl.controls = true;
              audioEl.src = msg.audioUrl;
              div.appendChild(audioEl);
            } else if (msg.type === "call") {
              div.classList.add("msg-call");
              const icono = msg.callType === "video" ? "🎥" : "📞";
              const tipoTexto = msg.callType === "video" ? "Videollamada" : "Llamada de voz";
              let texto;
              if (msg.callResult === "finalizada") {
                // Llamada que sí se contestó: mismo texto y duración para
                // los dos, distinguiendo solo si fue saliente o entrante.
                const m = Math.floor((msg.duration || 0) / 60);
                const s = String((msg.duration || 0) % 60).padStart(2, "0");
                const direccion = esMio ? "saliente" : "entrante";
                texto = `${tipoTexto} ${direccion} · ${m}:${s}`;
              } else if (msg.callResult === "rechazada") {
                // "rechazada" siempre significa que quien recibía la
                // llamada la rechazó activamente (tocó "Colgar" antes de
                // contestar), así que a ambos les mostramos lo mismo.
                texto = `${tipoTexto} rechazada`;
              } else if (msg.callResult === "cancelada") {
                // "cancelada" significa que quien llamó colgó antes de
                // que el otro contestara: para quien llamó es una llamada
                // cancelada; para el otro, una llamada perdida.
                texto = esMio ? `${tipoTexto} cancelada` : "Llamada perdida";
              } else {
                texto = tipoTexto;
              }
              const callDiv = document.createElement("div");
              callDiv.className = "msg-text msg-call-text";
              callDiv.textContent = `${icono} ${texto}`;
              div.appendChild(callDiv);
            } else {
              const textoDiv = document.createElement("div");
              textoDiv.className = "msg-text";
              textoDiv.textContent = msg.content;
              div.appendChild(textoDiv);
            }

            // Fila de metadatos: hora del mensaje y, si es mío, el estado
            // de lectura (como en WhatsApp: un check = enviado, dos check
            // azules = leído por el otro usuario).
            const metaDiv = document.createElement("div");
            metaDiv.className = "msg-meta";

            const horaSpan = document.createElement("span");
            horaSpan.className = "msg-time";
            horaSpan.textContent = formatearHora(msg.timestamp);
            metaDiv.appendChild(horaSpan);

            if (esMio) {
              const leido = !!(msg.readBy && msg.readBy.includes(currentFriend.uid));
              const ticksSpan = document.createElement("span");
              ticksSpan.className = "msg-ticks" + (leido ? " read" : "");
              ticksSpan.textContent = "✓✓";
              ticksSpan.title = leido ? "Leído" : "Enviado";
              metaDiv.appendChild(ticksSpan);
            }

            div.appendChild(metaDiv);
            messagesDiv.appendChild(div);
          });
        }

        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        markAsRead(docsOrdenados);
      }, (err) => {
        console.error("Error cargando mensajes:", err);
        document.getElementById("chatErrorBox").innerHTML =
          `<div class="chat-error">No se pudieron cargar los mensajes: ${err.message}</div>`;
      });
    }

    // Convierte el timestamp de Firestore a una hora legible tipo "14:32".
    // Mientras el servidor todavía no confirma serverTimestamp() (justo al
    // enviar), msg.timestamp puede venir null por unos instantes: en ese
    // caso mostramos la hora actual del navegador para que no quede vacío.
    function formatearHora(timestamp) {
      const fecha = timestamp ? timestamp.toDate() : new Date();
      return fecha.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    async function markAsRead(docsOrdenados) {
      for (const { id, data: msg } of docsOrdenados) {
        if (msg.to === currentUser.uid && (!msg.readBy || !msg.readBy.includes(currentUser.uid))) {
          try {
            await updateDoc(doc(db, "privateChat", id), { readBy: arrayUnion(currentUser.uid) });
          } catch (err) {
            console.error("Error marcando como leído:", err);
          }
        }
      }
    }

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      if (unsubTyping) unsubTyping();
      if (unsubIncomingCalls) unsubIncomingCalls();
      if (activeCallDocId) await colgarLlamada(true);
      await marcarEscribiendo(false);
      try { if (currentUser) await deleteDoc(doc(db, "onlineUsers", currentUser.uid)); } catch (e) {}
      await signOut(auth);
      window.location.href = "index.html";
    });
  </script>
  
</body>
</html>
