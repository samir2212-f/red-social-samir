<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social — Chat privado</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-chat">
  <header class="topbar">
    <div class="brand"><span class="dot"></span>Chat privado</div>
    <nav style="display:flex; align-items:center; gap:14px;">
      <a href="home.html" style="color:var(--ink-dim); text-decoration:none; font-size:14px; font-weight:500;">Inicio</a>
      <button id="logoutBtn" class="btn-ghost" style="border-radius:999px;">Cerrar sesión</button>
    </nav>
  </header>
  
  <div class="chat-shell">
    
    <section id="friendList"><p class="empty">Cargando contactos...</p></section>

    <section id="chatWindow" style="display:none;">
      <button id="backBtn">← Volver a contactos</button>
      <h3 id="chatWith"></h3>
      <div id="chatErrorBox"></div>
      <div id="messages"></div>
      <div id="typingIndicator" class="typing-indicator" style="display:none;">
        <span></span><span></span><span></span>
      </div>
      <footer class="chatbox">
        <input type="text" id="messageInput" class="field" placeholder="Escribe un mensaje..." autocomplete="off">
        <button id="sendBtn">Enviar</button>

      </footer>
      
    
  </div>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
    import {
      collection, addDoc, query, onSnapshot, getDocs,
      updateDoc, doc, where, arrayUnion, serverTimestamp,
      setDoc
    } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";

    let currentUser;
    let currentFriend;
    let chatId;
    let unsubMessages = null;
    let unsubTyping = null;
    let typingTimeout = null;

    onAuthStateChanged(auth, (user) => {
      if (!user) { window.location.href = "index.html"; return; }
      currentUser = user;
      loadFriends();
    });

    async function loadFriends() {
      const querySnap = await getDocs(collection(db, "users"));
      const listDiv = document.getElementById("friendList");
      listDiv.innerHTML = "<h3>Contactos</h3>";

      const otros = querySnap.docs.map(d => d.data()).filter(u => u.uid !== currentUser.uid);
      if (otros.length === 0) {
        listDiv.innerHTML += "<p class='empty'>Todavía no hay otros usuarios registrados.</p>";
        return;
      }

      otros.forEach((data) => {
        const btn = document.createElement("button");
        btn.className = "friend";
        btn.innerHTML = `<span>${data.nombre || data.email}</span>`;

        // Notificación de mensajes no leídos con este contacto.
        // Esta consulta solo usa "where" (sin orderBy), así que no necesita
        // ningún índice compuesto en Firestore.
        // Se filtra también por "participants" (array-contains) porque las
        // reglas de seguridad de Firestore, para operaciones de lista, exigen
        // que la propia consulta garantice que solo se pueden leer documentos
        // donde el usuario actual participa; con un simple where("chatId",...)
        // Firestore no puede probar eso y rechaza la consulta con
        // "Missing or insufficient permissions".
        const chatKey = [currentUser.uid, data.uid].sort().join("_");
        const q = query(
          collection(db, "privateChat"),
          where("chatId", "==", chatKey),
          where("participants", "array-contains", currentUser.uid)
        );
        onSnapshot(q, (snap) => {
          const unreadCount = snap.docs.filter(d => {
            const m = d.data();
            return m.to === currentUser.uid && (!m.readBy || !m.readBy.includes(currentUser.uid));
          }).length;
          btn.innerHTML = unreadCount > 0
            ? `<span>${data.nombre || data.email}</span><span class="unread">${unreadCount}</span>`
            : `<span>${data.nombre || data.email}</span>`;
        }, (err) => {
          console.error("Error escuchando mensajes no leídos:", err);
        });

        btn.onclick = () => openChat(data);
        listDiv.appendChild(btn);
      });
    }

    function openChat(friend) {
      currentFriend = friend;
      chatId = [currentUser.uid, friend.uid].sort().join("_");

      document.getElementById("chatWith").textContent = "Chateando con " + (friend.nombre || friend.email);
      document.getElementById("friendList").style.display = "none";
      document.getElementById("chatWindow").style.display = "block";
      document.getElementById("chatErrorBox").innerHTML = "";

      loadMessages();
      escucharEscribiendo();
    }

    document.getElementById("backBtn").addEventListener("click", () => {
      if (unsubMessages) unsubMessages();
      if (unsubTyping) unsubTyping();
      marcarEscribiendo(false);
      document.getElementById("chatWindow").style.display = "none";
      document.getElementById("friendList").style.display = "block";
    });

    async function sendMessage() {
      const input = document.getElementById("messageInput");
      const text = input.value.trim();
      if (text === "" || !chatId) return;
      input.value = "";
      marcarEscribiendo(false); // al enviar, dejamos de mostrar "escribiendo..."
      try {
        await addDoc(collection(db, "privateChat"), {
          chatId,
          uid: currentUser.uid,
          to: currentFriend.uid,
          // Array con ambos UIDs: permite que las reglas de seguridad
          // verifiquen, directamente desde la consulta, que el usuario
          // que lee pertenece a la conversación (ver firestore.rules).
          participants: [currentUser.uid, currentFriend.uid],
          content: text,
          readBy: [],
          timestamp: serverTimestamp()
        });
      } catch (err) {
        console.error("Error enviando mensaje:", err);
        document.getElementById("chatErrorBox").innerHTML =
          `<div class="chat-error">No se pudo enviar el mensaje: ${err.message}</div>`;
      }
    }
    document.getElementById("sendBtn").addEventListener("click", sendMessage);
    document.getElementById("messageInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    // ------------------------------------------------------------------
    // Indicador de "está escribiendo..." (las bolitas tipo WhatsApp)
    // ------------------------------------------------------------------
    // Se usa una colección nueva "typingStatus" con UN documento por
    // conversación (mismo id que chatId). Dentro, cada usuario tiene su
    // propio campo con su UID, en true si está escribiendo ahora mismo.
    // Con setDoc(..., {merge:true}) cada quien solo toca su propio campo,
    // sin pisar el del otro usuario.

    document.getElementById("messageInput").addEventListener("input", () => {
      if (!chatId) return;
      marcarEscribiendo(true);
      // Si el usuario deja de teclear 2 segundos, se apaga solo,
      // por si cierra la pestaña o se queda pensando sin escribir.
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => marcarEscribiendo(false), 2000);
    });

    async function marcarEscribiendo(estaEscribiendo) {
      if (!chatId || !currentUser) return;
      try {
        await setDoc(
          doc(db, "typingStatus", chatId),
          { [currentUser.uid]: estaEscribiendo },
          { merge: true }
        );
      } catch (err) {
        console.error("Error actualizando estado de escritura:", err);
      }
    }

    function escucharEscribiendo() {
      if (unsubTyping) unsubTyping();
      const indicador = document.getElementById("typingIndicator");
      unsubTyping = onSnapshot(doc(db, "typingStatus", chatId), (snap) => {
        const data = snap.data();
        const amigoEscribiendo = !!(data && data[currentFriend.uid]);
        indicador.style.display = amigoEscribiendo ? "flex" : "none";
      }, (err) => {
        console.error("Error escuchando estado de escritura:", err);
      });
    }

    // BUG ARREGLADO:
    // Antes esta consulta combinaba where("chatId","==",chatId) con
    // orderBy("timestamp"). Firestore exige un índice compuesto para eso,
    // y como el proyecto no lo tenía creado, la consulta fallaba en
    // silencio (onSnapshot nunca entregaba datos) y el chat privado se
    // quedaba vacío para siempre, aunque el chat general sí funcionaba
    // porque ese solo usa orderBy sin where.
    // Ahora se ordena en el propio navegador, así no hace falta ningún
    // índice adicional en Firestore, y se muestra cualquier error real
    // en pantalla en vez de solo en la consola.
    function loadMessages() {
      if (unsubMessages) unsubMessages();
      // Igual que en loadFriends(): se agrega el filtro por "participants"
      // (array-contains) porque las reglas de seguridad exigen que la
      // propia consulta pruebe que el usuario actual pertenece al chat.
      const q = query(
        collection(db, "privateChat"),
        where("chatId", "==", chatId),
        where("participants", "array-contains", currentUser.uid)
      );
      unsubMessages = onSnapshot(q, (snapshot) => {
        document.getElementById("chatErrorBox").innerHTML = "";
        const messagesDiv = document.getElementById("messages");
        messagesDiv.innerHTML = "";

        const docsOrdenados = snapshot.docs
          .map(d => ({ id: d.id, data: d.data() }))
          .sort((a, b) => {
            const ta = a.data.timestamp ? a.data.timestamp.toMillis() : 0;
            const tb = b.data.timestamp ? b.data.timestamp.toMillis() : 0;
            return ta - tb;
          });

        if (docsOrdenados.length === 0) {
          messagesDiv.innerHTML = "<p class='empty'>Todavía no hay mensajes. Escribe el primero.</p>";
        } else {
          docsOrdenados.forEach(({ data: msg }) => {
            const esMio = msg.uid === currentUser.uid;

            const div = document.createElement("div");
            div.classList.add("msg", esMio ? "mine" : "theirs");

            const textoDiv = document.createElement("div");
            textoDiv.className = "msg-text";
            textoDiv.textContent = msg.content;
            div.appendChild(textoDiv);

            // Fila de metadatos: hora del mensaje y, si es mío, el estado
            // de lectura (como en WhatsApp: un check = enviado, dos check
            // azules = leído por el otro usuario).
            const metaDiv = document.createElement("div");
            metaDiv.className = "msg-meta";

            const horaSpan = document.createElement("span");
            horaSpan.className = "msg-time";
            horaSpan.textContent = formatearHora(msg.timestamp);
            metaDiv.appendChild(horaSpan);

            if (esMio) {
              const leido = !!(msg.readBy && msg.readBy.includes(currentFriend.uid));
              const ticksSpan = document.createElement("span");
              ticksSpan.className = "msg-ticks" + (leido ? " read" : "");
              ticksSpan.textContent = "✓✓";
              ticksSpan.title = leido ? "Leído" : "Enviado";
              metaDiv.appendChild(ticksSpan);
            }

            div.appendChild(metaDiv);
            messagesDiv.appendChild(div);
          });
        }

        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        markAsRead(docsOrdenados);
      }, (err) => {
        console.error("Error cargando mensajes:", err);
        document.getElementById("chatErrorBox").innerHTML =
          `<div class="chat-error">No se pudieron cargar los mensajes: ${err.message}</div>`;
      });
    }

    // Convierte el timestamp de Firestore a una hora legible tipo "14:32".
    // Mientras el servidor todavía no confirma serverTimestamp() (justo al
    // enviar), msg.timestamp puede venir null por unos instantes: en ese
    // caso mostramos la hora actual del navegador para que no quede vacío.
    function formatearHora(timestamp) {
      const fecha = timestamp ? timestamp.toDate() : new Date();
      return fecha.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    async function markAsRead(docsOrdenados) {
      for (const { id, data: msg } of docsOrdenados) {
        if (msg.to === currentUser.uid && (!msg.readBy || !msg.readBy.includes(currentUser.uid))) {
          try {
            await updateDoc(doc(db, "privateChat", id), { readBy: arrayUnion(currentUser.uid) });
          } catch (err) {
            console.error("Error marcando como leído:", err);
          }
        }
      }
    }

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      if (unsubTyping) unsubTyping();
      await marcarEscribiendo(false);
      await signOut(auth);
      window.location.href = "index.html";
    });
  </script>
  
</body>
</html>
