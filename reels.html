<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samir Social — Subir reel</title>
  <style>
    * { box-sizing: border-box; }
    body {
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      height:100vh; background:black; color:white;
      font-family:sans-serif; gap: 6px; margin: 0;
    }
    a.back { position: absolute; top: 20px; left: 20px; color: #aaa; text-decoration: none; font-size: 14px; }
    button {
      margin-top:10px; padding:10px 20px;
      background:linear-gradient(45deg,#ff0057,#ff7b00);
      border:none; border-radius:20px; color:white;
      font-size:16px; cursor:pointer;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    input { margin-top:15px; }
    #status { min-height: 18px; font-size: 13px; color: #aaa; }
  </style>
</head>
<body>
  <a class="back" href="home.html">← Inicio</a>
  <h2>📤 Subir reel</h2>
  <input type="file" id="videoFile" accept="video/*">
  <button id="uploadBtn">Publicar</button>
  <p id="status"></p>

  <!-- SDK de Supabase -->
  <script src="https://unpkg.com/@supabase/supabase-js"></script>
  <script>
    const SUPABASE_URL = "https://klziukovalzzcinifvaw.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtseml1a292YWx6emNpbmlmdmF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY0Mzg1MDcsImV4cCI6MjA3MjAxNDUwN30.edpw-UnymgHSAhp54SX6CCKfEjB7SQDdSrhH3wc-Eh4";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const status = document.getElementById("status");
    const uploadBtn = document.getElementById("uploadBtn");

    async function uploadReel() {
      const fileInput = document.getElementById("videoFile");
      if (fileInput.files.length === 0) {
        status.textContent = "Selecciona un video primero.";
        return;
      }

      const file = fileInput.files[0];
      const fileName = "reels/" + Date.now() + "-" + file.name;

      uploadBtn.disabled = true;
      status.textContent = "Subiendo video...";

      const { error } = await supabase.storage
        .from("Samir")
        .upload(fileName, file, { cacheControl: "3600", upsert: false });

      if (error) {
        console.error(error);
        status.textContent = "❌ Error al subir el video: " + error.message;
        uploadBtn.disabled = false;
        return;
      }

      status.textContent = "✅ Video subido correctamente. Redirigiendo...";
      setTimeout(() => { window.location.href = "feed.html"; }, 800);
    }

    uploadBtn.addEventListener("click", uploadReel);
  </script>
</body>
</html>
