<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samir Social — Subir reel</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Aviso de llamada entrante, visible en cualquier página del sitio -->
  <script type="module" src="incoming-call.js"></script>
</head>
<body class="page-upload">
  <a class="back" href="home.html">← Inicio</a>
  <div class="upload-card">
    <h2>Subir reel</h2>
    <p class="hint">Comparte un video corto con la comunidad</p>
    <input type="file" id="videoFile" accept="video/*">
    <button id="uploadBtn" class="btn btn-primary">Publicar</button>
    <p id="status"></p>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://klziukovalzzcinifvaw.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtseml1a292YWx6emNpbmlmdmF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY0Mzg1MDcsImV4cCI6MjA3MjAxNDUwN30.edpw-UnymgHSAhp54SX6CCKfEjB7SQDdSrhH3wc-Eh4";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const status = document.getElementById("status");
    const uploadBtn = document.getElementById("uploadBtn");

    async function uploadReel() {
      const fileInput = document.getElementById("videoFile");
      if (fileInput.files.length === 0) {
        status.textContent = "Selecciona un video primero.";
        return;
      }

      const file = fileInput.files[0];
      const fileName = "reels/" + Date.now() + "-" + file.name;

      uploadBtn.disabled = true;
      status.textContent = "Subiendo video...";

      const { error } = await supabase.storage
        .from("Samir")
        .upload(fileName, file, { cacheControl: "3600", upsert: false });

      if (error) {
        console.error(error);
        status.textContent = "❌ Error al subir el video: " + error.message;
        uploadBtn.disabled = false;
        return;
      }

      status.textContent = "✅ Video subido correctamente. Redirigiendo...";
      setTimeout(() => { window.location.href = "feed.html"; }, 800);
    }

    uploadBtn.addEventListener("click", uploadReel);
  </script>
</body>
</html>
