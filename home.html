<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samir Social — Inicio</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #111; color: #eee; margin: 0; padding: 0; display: flex; min-height: 100vh; }
    header { background: linear-gradient(90deg, #222, #444); padding: 15px 20px; font-size: 20px; font-weight: bold; color: #fff; display: flex; justify-content: space-between; align-items: center; }
    nav { background: #222; display: flex; justify-content: center; gap: 20px; padding: 10px; }
    nav a { color: #ccc; text-decoration: none; font-weight: bold; position: relative; padding: 6px 12px; border-radius: 6px; }
    nav a:hover { background: #333; color: #fff; }
    #chatNotif { display: none; background: red; color: white; font-size: 12px; padding: 2px 6px; border-radius: 50%; position: absolute; top: -6px; right: -8px; }
    main { flex: 1; padding: 20px; }
    aside { width: 240px; background: #1c1c1c; padding: 15px; border-left: 2px solid #333; }
    .post-box { background: #222; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    textarea, input[type="file"] { width: 100%; padding: 10px; border-radius: 8px; border: none; outline: none; resize: none; background: #333; color: #eee; margin-bottom: 10px; }
    button { margin-top: 10px; padding: 10px 15px; border: none; border-radius: 6px; background: #0af; color: #fff; cursor: pointer; }
    button:hover { background: #09c; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .post { background: #1a1a1a; margin-bottom: 15px; padding: 15px; border-radius: 8px; box-shadow: 0px 0px 5px rgba(255,255,255,0.1); }
    .post strong { color: #0af; }
    .post small { display: block; color: #888; margin-top: 5px; }
    .post img { max-width: 100%; border-radius: 6px; margin-top: 10px; }
    .reactions button { margin-right: 5px; font-size: 14px; background: #333; }
    #profile { position: relative; cursor: pointer; background: #222; padding: 8px 12px; border-radius: 6px; }
    #profileMenu { display: none; position: absolute; right: 0; top: 40px; background: #222; border: 1px solid #333; border-radius: 6px; padding: 10px; min-width: 180px; z-index: 9999; }
    #profileMenu a, #profileMenu button { display: block; padding: 6px; color: #ccc; text-decoration: none; background:none; border:none; width:100%; text-align:left; cursor:pointer; margin:0; }
    #profileMenu a:hover, #profileMenu button:hover { background:#333; color:#fff; }
    .empty { color: #777; font-style: italic; }
    .light { background: #f4f4f4; color: #111; }
    .light nav, .light header, .light aside { background: #ddd; color: #111; }
    .light .post { background: #fff; color: #000; }
  </style>
</head>
<body>
  <div style="flex:1; display:flex; flex-direction:column;">
    <header>
      <div>💬 Samir Social</div>
      <div id="profile">👤 <span id="profileName">Cargando...</span>
        <div id="profileMenu">
          <button id="editNameBtn">✏️ Cambiar nombre</button>
          <button id="btnAdmin" style="display:none;">🛡️ Panel admin</button>
          <a href="#" id="logoutBtn">🚪 Cerrar sesión</a>
        </div>
      </div>
    </header>
    <nav>
      <a href="home.html">🏠 Inicio</a>
      <a href="reels.html">🎥 Subir reel</a>
      <a href="feed.html">📺 Ver reels</a>
      <a href="chat.html" id="chatLink">💌 Chat <span id="chatNotif">0</span></a>
      <a href="#" id="toggleMode">🌙</a>
    </nav>
    <main>
      <h2 id="welcome">Bienvenido</h2>
      <section class="post-box">
        <textarea id="postContent" rows="3" placeholder="Escribe un mensaje..."></textarea>
        <input type="file" id="fileInput" accept="image/*">
        <button id="publishBtn">Enviar mensaje</button>
      </section>
      <section>
        <h2>📝 Mensajes</h2>
        <div id="feed"><p class="empty">Aún no hay mensajes.</p></div>
      </section>
    </main>
  </div>
  <aside>
    <h3>🟢 Usuarios en línea</h3>
    <ul id="userList"></ul>
  </aside>

  <!-- Supabase (almacenamiento de imágenes) -->
  <script src="https://unpkg.com/@supabase/supabase-js"></script>

  <script type="module">
  import { auth, db, ADMINS } from "./firebase-config.js";
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
  import {
    collection, addDoc, serverTimestamp, query, orderBy, onSnapshot,
    doc, getDoc, setDoc, updateDoc, arrayUnion, deleteDoc, limit
  } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";

  // Configuración de Supabase (almacenamiento de imágenes de los posts)
  const supabaseUrl = "https://klziukovalzzcinifvaw.supabase.co";
  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtseml1a292YWx6emNpbmlmdmF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY0Mzg1MDcsImV4cCI6MjA3MjAxNDUwN30.edpw-UnymgHSAhp54SX6CCKfEjB7SQDdSrhH3wc-Eh4";
  const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

  let currentUser;

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      const userRef = doc(db, "users", user.uid);
      const userSnap = await getDoc(userRef);
      let displayName = user.email;
      if (userSnap.exists() && userSnap.data().nombre) {
        displayName = userSnap.data().nombre;
      }
      document.getElementById("profileName").innerText = displayName;
      document.getElementById("welcome").innerText = "Bienvenido, " + displayName;

      if (ADMINS.includes(user.uid)) {
        const btnAdmin = document.getElementById("btnAdmin");
        btnAdmin.style.display = "block";
        btnAdmin.addEventListener("click", () => window.location.href = "paneladm.html");
      }

      await setDoc(doc(db, "onlineUsers", user.uid), {
        email: user.email,
        lastActive: serverTimestamp(),
        online: true
      });
      window.addEventListener("beforeunload", async () => {
        try { await deleteDoc(doc(db, "onlineUsers", user.uid)); } catch (e) {}
      });

      loadPosts();
      loadUsers();
      monitorPrivateChat();
    } else {
      window.location.href = "index.html";
    }
  });

  async function publishPost() {
    const contentInput = document.getElementById("postContent");
    const fileInput = document.getElementById("fileInput");
    const publishBtn = document.getElementById("publishBtn");
    const content = contentInput.value.trim();
    let imageUrl = null;

    if (content === "" && fileInput.files.length === 0) return;

    publishBtn.disabled = true;
    try {
      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const fileName = Date.now() + "_" + file.name;
        const { error } = await supabase.storage.from("posts").upload(fileName, file);
        if (error) {
          console.error("Error al subir archivo:", error.message);
          alert("No se pudo subir la imagen: " + error.message);
        } else {
          const { data: publicData } = supabase.storage.from("posts").getPublicUrl(fileName);
          imageUrl = publicData.publicUrl;
        }
      }

      if (content !== "" || imageUrl) {
        await addDoc(collection(db, "chat"), {
          uid: currentUser.uid,
          content,
          imageUrl,
          timestamp: serverTimestamp()
        });
      }

      contentInput.value = "";
      fileInput.value = "";
    } finally {
      publishBtn.disabled = false;
    }
  }
  document.getElementById("publishBtn").addEventListener("click", publishPost);

  // Caché simple de nombres de usuario para no repetir lecturas a Firestore
  const nombreCache = new Map();
  async function nombreDe(uid) {
    if (!uid) return "Usuario";
    if (nombreCache.has(uid)) return nombreCache.get(uid);
    const userDoc = await getDoc(doc(db, "users", uid));
    const nombre = userDoc.exists() ? (userDoc.data().nombre || "Usuario") : "Usuario";
    nombreCache.set(uid, nombre);
    return nombre;
  }

  function loadPosts() {
    const qy = query(collection(db, "chat"), orderBy("timestamp", "desc"), limit(50));
    onSnapshot(qy, async (snapshot) => {
      const feedDiv = document.getElementById("feed");
      if (snapshot.empty) {
        feedDiv.innerHTML = "<p class='empty'>Aún no hay mensajes.</p>";
        return;
      }
      feedDiv.innerHTML = "";
      for (const docSnap of snapshot.docs) {
        const post = docSnap.data();
        const username = await nombreDe(post.uid);
        const div = document.createElement("div");
        div.classList.add("post");
        div.innerHTML = `
          <p><strong>${username}</strong></p>
          <p>${post.content || ""}</p>
          ${post.imageUrl ? `<img src="${post.imageUrl}" alt="Imagen adjunta">` : ""}
          <div class="reactions">
            <button>👍</button>
            <button>😂</button>
            <button>❤️</button>
          </div>
          <small>${post.timestamp ? post.timestamp.toDate().toLocaleString() : ""}</small>`;
        feedDiv.appendChild(div);
      }
    });
  }

  function loadUsers() {
    const qy = query(collection(db, "onlineUsers"));
    onSnapshot(qy, (snapshot) => {
      const list = document.getElementById("userList");
      list.innerHTML = "";
      if (snapshot.empty) {
        list.innerHTML = "<li class='empty'>Nadie conectado</li>";
        return;
      }
      snapshot.docs.forEach(d => {
        const data = d.data();
        const li = document.createElement("li");
        li.innerHTML = `<span style="color:${data.online ? 'lime' : 'gray'}">●</span> ${data.email}`;
        list.appendChild(li);
      });
    });
  }

  // Notificaciones del chat privado.
  // Los mensajes privados se guardan en la colección "privateChat"
  // (ver chat.html), con el mismo formato que usa el panel admin.
  function monitorPrivateChat() {
    const chatNotif = document.getElementById("chatNotif");
    const qy = query(collection(db, "privateChat"), orderBy("timestamp", "desc"), limit(100));
    onSnapshot(qy, (snapshot) => {
      let unread = 0;
      snapshot.docs.forEach(docSnap => {
        const msg = docSnap.data();
        if (msg.uid !== currentUser.uid && msg.to === currentUser.uid && (!msg.readBy || !msg.readBy.includes(currentUser.uid))) {
          unread++;
        }
      });
      if (unread > 0) {
        chatNotif.style.display = "inline-block";
        chatNotif.textContent = unread;
      } else {
        chatNotif.style.display = "none";
      }
    });
  }

  document.getElementById("chatLink").addEventListener("click", async () => {
    const qy = query(collection(db, "privateChat"), orderBy("timestamp", "desc"), limit(200));
    const snapshot = await new Promise(resolve => {
      const unsub = onSnapshot(qy, s => { unsub(); resolve(s); });
    });
    snapshot.docs.forEach(async (docSnap) => {
      const msg = docSnap.data();
      if (msg.uid !== currentUser.uid && msg.to === currentUser.uid && (!msg.readBy || !msg.readBy.includes(currentUser.uid))) {
        await updateDoc(doc(db, "privateChat", docSnap.id), { readBy: arrayUnion(currentUser.uid) });
      }
    });
  });

  document.getElementById("editNameBtn").addEventListener("click", async () => {
    const newName = prompt("Escribe tu nuevo nombre:");
    if (newName && currentUser) {
      await setDoc(doc(db, "users", currentUser.uid), { nombre: newName }, { merge: true });
      document.getElementById("profileName").innerText = newName;
      document.getElementById("welcome").innerText = "Bienvenido, " + newName;
      nombreCache.set(currentUser.uid, newName);
    }
  });

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    try { if (currentUser) await deleteDoc(doc(db, "onlineUsers", currentUser.uid)); } catch (e) {}
    signOut(auth).then(() => window.location.href = "index.html");
  });

  document.getElementById("toggleMode").addEventListener("click", () => {
    document.body.classList.toggle("light");
  });

  document.getElementById("profile").addEventListener("click", () => {
    const menu = document.getElementById("profileMenu");
    menu.style.display = menu.style.display === "block" ? "none" : "block";
  });
  </script>
</body>
</html>
