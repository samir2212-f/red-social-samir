<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Samir Social — Panel de administración</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    body{font-family:sans-serif;background:#111;color:#eee;margin:0;padding:0;}
    header{background:#222;padding:10px;text-align:center;}
    header h1{margin:0;font-size:20px;}
    nav{display:flex;justify-content:center;background:#333;flex-wrap:wrap;}
    nav button{padding:10px 20px;border:none;background:#333;color:#eee;cursor:pointer;}
    nav button.active{background:#555;}
    section{display:none;padding:15px;}
    section.active{display:block;}
    ul.list{list-style:none;padding:0;margin:0;}
    ul.list li{background:#222;margin-bottom:8px;padding:10px;border-radius:6px;}
    .actions{margin-top:6px;}
    .actions button{margin-right:5px;}
    input.rename{padding:4px;border-radius:4px;border:1px solid #555;background:#222;color:#fff;}
    .empty{color:#777;font-style:italic;}
    #gate{display:flex;align-items:center;justify-content:center;height:100vh;font-size:18px;color:#aaa;}
  </style>
</head>
<body>
  <div id="gate">Verificando acceso…</div>

  <div id="panel" style="display:none;">
    <header>
      <h1>⚙️ Panel de administración</h1>
    </header>

    <nav>
      <button data-tab="privados" class="active">Privados (moderación)</button>
      <button data-tab="todos">Todos los privados</button>
      <button data-tab="usuarios">Usuarios</button>
      <button data-tab="posts">Posts</button>
      <button data-tab="ajustes">Ajustes</button>
    </nav>

    <main>
      <section id="privados" class="active">
        <h2>Mensajes privados con lenguaje inapropiado</h2>
        <ul id="badPrivados" class="list"></ul>
      </section>

      <section id="todos">
        <h2>Todos los mensajes privados</h2>
        <ul id="allPrivados" class="list"></ul>
      </section>

      <section id="usuarios">
        <h2>Usuarios registrados</h2>
        <ul id="usersList" class="list"></ul>
      </section>

      <section id="posts">
        <h2>Posts del feed</h2>
        <ul id="postsList" class="list"></ul>
      </section>

      <section id="ajustes">
        <h2>Ajustes</h2>
        <p>Sección reservada para futuras configuraciones del sistema.</p>
      </section>
    </main>
  </div>

  <script type="module">
    import { auth, db, ADMINS } from "./firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
    import { collection, query, orderBy, limit, onSnapshot, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";

    // Verificación de acceso: solo usuarios logueados y con su UID en ADMINS
    // pueden ver este panel. Antes cualquiera que conociera la URL entraba.
    onAuthStateChanged(auth, (user) => {
      if (!user) { window.location.href = "index.html"; return; }
      if (!ADMINS.includes(user.uid)) {
        alert("No tienes permisos de administrador.");
        window.location.href = "home.html";
        return;
      }
      document.getElementById("gate").style.display = "none";
      document.getElementById("panel").style.display = "block";
      initPanel();
    });

    function renderList(ul, docs, mapRow) {
      ul.innerHTML = "";
      if (docs.length === 0) {
        ul.innerHTML = "<li class='empty'>No hay elementos.</li>";
        return;
      }
      docs.forEach(mapRow);
    }

    function initPanel() {
      // Navegación entre pestañas
      const navBtns = document.querySelectorAll("nav button");
      const sections = document.querySelectorAll("main section");
      navBtns.forEach(btn => {
        btn.addEventListener("click", () => {
          navBtns.forEach(b => b.classList.remove("active"));
          sections.forEach(s => s.classList.remove("active"));
          btn.classList.add("active");
          document.getElementById(btn.dataset.tab).classList.add("active");
        });
      });

      // Palabras filtradas para moderación
      const malas = ["tonto", "mierda", "puta", "imbecil", "cabrón", "pendejo"];
      const contieneMala = txt => malas.some(p => txt?.toLowerCase().includes(p));

      // Privados con lenguaje inapropiado
      const q1 = query(collection(db, "privateChat"), orderBy("timestamp", "desc"), limit(200));
      onSnapshot(q1, snap => {
        const ul = document.getElementById("badPrivados");
        const docs = snap.docs.filter(d => contieneMala(d.data().content || d.data().text || ""));
        renderList(ul, docs, d => {
          const m = d.data();
          const li = document.createElement("li");
          li.innerHTML = `
            <div><strong>${m.uid}</strong></div>
            <div>${m.content || m.text}</div>
            <div class="actions"><button class="del">🗑️ Eliminar</button></div>
          `;
          li.querySelector(".del").onclick = () => deleteDoc(doc(db, "privateChat", d.id));
          ul.appendChild(li);
        });
      });

      // Todos los privados
      const q2 = query(collection(db, "privateChat"), orderBy("timestamp", "desc"), limit(300));
      onSnapshot(q2, snap => {
        const ul = document.getElementById("allPrivados");
        renderList(ul, snap.docs, d => {
          const m = d.data();
          const li = document.createElement("li");
          li.innerHTML = `
            <div><strong>${m.uid}</strong></div>
            <div>${m.content || m.text}</div>
            <div class="actions"><button class="del">🗑️ Eliminar</button></div>
          `;
          li.querySelector(".del").onclick = () => deleteDoc(doc(db, "privateChat", d.id));
          ul.appendChild(li);
        });
      });

      // Usuarios con opción de renombrar / eliminar
      onSnapshot(collection(db, "users"), snap => {
        const ul = document.getElementById("usersList");
        renderList(ul, snap.docs, d => {
          const u = d.data();
          const li = document.createElement("li");
          li.innerHTML = `
            <div><strong>${u.nombre || "(sin nombre)"}</strong> (${d.id})</div>
            <input class="rename" type="text" placeholder="Nuevo nombre"/>
            <div class="actions">
              <button class="save">💾 Renombrar</button>
              <button class="del">🗑️ Eliminar</button>
            </div>
          `;
          li.querySelector(".save").onclick = async () => {
            const nuevo = li.querySelector(".rename").value.trim();
            if (nuevo) await updateDoc(doc(db, "users", d.id), { nombre: nuevo });
          };
          li.querySelector(".del").onclick = () => deleteDoc(doc(db, "users", d.id));
          ul.appendChild(li);
        });
      });

      // Posts del feed principal (colección "chat")
      onSnapshot(collection(db, "chat"), snap => {
        const ul = document.getElementById("postsList");
        renderList(ul, snap.docs, d => {
          const p = d.data();
          const li = document.createElement("li");
          li.innerHTML = `
            <div><strong>${p.uid}</strong></div>
            <div>${p.content || ""}</div>
            <div class="actions"><button class="del">🗑️ Eliminar</button></div>
          `;
          li.querySelector(".del").onclick = () => deleteDoc(doc(db, "chat", d.id));
          ul.appendChild(li);
        });
      });
    }
  </script>
</body>
</html>
