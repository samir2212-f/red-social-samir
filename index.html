<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samir Social — Iniciar sesión</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-login">
  <div class="login-card">
    <div class="login-mark"><span class="dot"></span><h1>Samir Social</h1></div>
    <p class="subtitle">Inicia sesión o crea tu cuenta para entrar</p>
    <input type="email" id="email" class="field" placeholder="Correo" autocomplete="email">
    <input type="password" id="password" class="field" placeholder="Contraseña" autocomplete="current-password">
    <button id="loginBtn" class="btn btn-primary">Iniciar sesión</button>
    <button id="registerBtn" class="btn btn-secondary" style="width:100%; margin-top:8px;">Registrarse</button>
    <p id="authMsg"></p>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import { signInWithEmailAndPassword, createUserWithEmailAndPassword }
      from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
    import { setDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const authMsg = document.getElementById("authMsg");
    const loginBtn = document.getElementById("loginBtn");
    const registerBtn = document.getElementById("registerBtn");

    function mensajeError(e) {
      const map = {
        "auth/invalid-email": "El correo no es válido.",
        "auth/missing-password": "Escribe una contraseña.",
        "auth/user-not-found": "No existe una cuenta con ese correo.",
        "auth/wrong-password": "Contraseña incorrecta.",
        "auth/invalid-credential": "Correo o contraseña incorrectos.",
        "auth/email-already-in-use": "Ya existe una cuenta con ese correo.",
        "auth/weak-password": "La contraseña debe tener al menos 6 caracteres."
      };
      return map[e.code] || e.message;
    }

    function setLoading(loading) {
      loginBtn.disabled = loading;
      registerBtn.disabled = loading;
    }

    async function login() {
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      if (!email || !password) { authMsg.textContent = "Completa correo y contraseña."; return; }
      setLoading(true);
      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "home.html";
      } catch (e) {
        authMsg.textContent = mensajeError(e);
      } finally {
        setLoading(false);
      }
    }

    async function register() {
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      if (!email || !password) { authMsg.textContent = "Completa correo y contraseña."; return; }
      setLoading(true);
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await setDoc(doc(db, "users", cred.user.uid), {
          uid: cred.user.uid,
          email: email,
          nombre: email.split("@")[0]
        });
        window.location.href = "home.html";
      } catch (e) {
        authMsg.textContent = mensajeError(e);
      } finally {
        setLoading(false);
      }
    }

    loginBtn.addEventListener("click", login);
    registerBtn.addEventListener("click", register);
    passwordInput.addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
  </script>
</body>
</html>
